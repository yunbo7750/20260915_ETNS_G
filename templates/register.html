<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 - ETNS TODO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="scanlines"></div>
  <div class="container auth-container">
    <header>
      <h1 data-text="TASK//GRID">TASK//GRID</h1>
      <p class="subtitle">NEW USER // REGISTER</p>
    </header>

    {% if error %}
    <p class="auth-error">&gt; ERROR: {{ error }}</p>
    {% endif %}

    <form class="auth-form" action="{{ url_for('register') }}" method="post">
      <input type="text" name="username" placeholder="USER_ID" autocomplete="username" required autofocus>
      <input type="password" name="password" placeholder="PASSCODE" autocomplete="new-password" required>
      <button type="submit">&gt; INITIALIZE</button>
    </form>

    <p class="auth-switch">
      HAVE ACCOUNT? <a href="{{ url_for('login') }}">LOGIN</a>
    </p>
  </div>
</body>
</html>
