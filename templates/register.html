<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 - ETNS TODO</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container auth-container">
    <header>
      <h1>📝 할일관리</h1>
      <p class="subtitle">회원가입</p>
    </header>

    {% if error %}
    <p class="auth-error">{{ error }}</p>
    {% endif %}

    <form class="auth-form" action="{{ url_for('register') }}" method="post">
      <input type="text" name="username" placeholder="아이디" autocomplete="username" required autofocus>
      <input type="password" name="password" placeholder="비밀번호" autocomplete="new-password" required>
      <button type="submit">가입하기</button>
    </form>

    <p class="auth-switch">
      이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a>
    </p>
  </div>
</body>
</html>
