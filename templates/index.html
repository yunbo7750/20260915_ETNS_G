<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할일관리 - ETNS TODO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="scanlines"></div>
  <div class="container">
    <header>
      <div class="topbar">
        <span class="username">&gt; {{ username }}<span class="cursor">_</span></span>
        <form action="{{ url_for('logout') }}" method="post">
          <button type="submit" class="logout-btn">[ LOGOUT ]</button>
        </form>
      </div>
      <h1 data-text="TASK//GRID">TASK//GRID</h1>
      <p class="subtitle">{{ done_count }} / {{ total }} COMPLETE</p>
    </header>

    <form class="add-form" action="{{ url_for('add') }}" method="post">
      <input
        type="text"
        name="title"
        placeholder="> 새 작업 입력..."
        autocomplete="off"
        required
      >
      <button type="submit">ADD +</button>
    </form>

    <nav class="filters">
      <a href="{{ url_for('index', filter='all') }}" class="{{ 'active' if filter == 'all' else '' }}">ALL</a>
      <a href="{{ url_for('index', filter='active') }}" class="{{ 'active' if filter == 'active' else '' }}">ACTIVE</a>
      <a href="{{ url_for('index', filter='done') }}" class="{{ 'active' if filter == 'done' else '' }}">DONE</a>
    </nav>

    <ul class="task-list">
      {% for task in tasks %}
      <li class="task {{ 'done' if task['done'] else '' }}">
        <form class="toggle-form" action="{{ url_for('toggle', task_id=task['id']) }}" method="post">
          <button type="submit" class="checkbox" aria-label="완료 토글">
            {{ '✔' if task['done'] else '' }}
          </button>
        </form>

        <span class="title">{{ task['title'] }}</span>
        <span class="created">{{ task['created_at'] }}</span>

        <form class="edit-form" action="{{ url_for('edit', task_id=task['id']) }}" method="post">
          <input type="text" name="title" value="{{ task['title'] }}" class="edit-input">
          <button type="submit" class="edit-btn">EDIT</button>
        </form>

        <form class="delete-form" action="{{ url_for('delete', task_id=task['id']) }}" method="post"
              onsubmit="return confirm('삭제할까요?');">
          <button type="submit" class="delete-btn">DEL</button>
        </form>
      </li>
      {% else %}
      <li class="empty">// NO DATA FOUND //</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
