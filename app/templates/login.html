{% extends "base.html" %}
{% block title %}로그인 · {{ service_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">{{ service_name }}</h1>
            <p class="text-muted">{{ service_tagline }}</p>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">아이디</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">비밀번호</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">로그인</button>
                </form>
            </div>
        </div>
        <div class="mt-3 text-center text-muted small">
            <p class="mb-1">테스트 계정</p>
            <p class="mb-0">관리자: admin / admin1234</p>
            <p class="mb-0">사용자: user01 ~ user05 / user1234</p>
        </div>
    </div>
</div>
{% endblock %}
