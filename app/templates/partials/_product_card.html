<div class="card h-100 shadow-sm rec-card">
    <a href="{{ url_for('product.product_detail', product_id=product.id) }}" class="text-decoration-none text-reset">
        <div class="rec-card-image d-flex align-items-center justify-content-center">
            {% if product.id in bestseller_ids %}
            <span class="badge-best">🏆 베스트 상품</span>
            {% endif %}
            {% if product.image_url %}
            <img src="{{ product.image_url }}" alt="{{ product.name }}" class="img-fluid">
            {% else %}
            <span class="display-6">📦</span>
            {% endif %}
        </div>
        <div class="card-body">
            <span class="badge bg-light text-dark border mb-2">{{ product.category }}</span>
            <h6 class="card-title mb-1">{{ product.name }}</h6>
            <p class="fw-bold text-primary mb-0">₩{{ "{:,}".format(product.price) }}</p>
        </div>
    </a>
    <div class="card-footer bg-white border-top-0 pt-0 d-flex gap-2">
        <form method="post" action="{{ url_for('cart.cart_add_item') }}" class="flex-fill">
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <input type="hidden" name="quantity" value="1">
            <button type="submit" class="btn btn-outline-secondary btn-sm w-100">장바구니 담기</button>
        </form>
        <form method="post" action="{{ url_for('cart.cart_buy_now') }}" class="flex-fill">
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <input type="hidden" name="quantity" value="1">
            <button type="submit" class="btn btn-primary btn-sm w-100">바로 결제</button>
        </form>
    </div>
</div>
