{% extends "base.html" %}
{% block title %}상품 둘러보기 · {{ service_name }}{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">상품 둘러보기</h4>

<div class="mb-4 d-flex flex-wrap gap-2">
    <a href="{{ url_for('product.product_list') }}"
       class="btn btn-sm {{ 'btn-primary' if not active_category else 'btn-outline-secondary' }}">전체</a>
    {% for c in categories %}
    <a href="{{ url_for('product.product_list', category=c) }}"
       class="btn btn-sm {{ 'btn-primary' if active_category == c else 'btn-outline-secondary' }}">{{ c }}</a>
    {% endfor %}
</div>

<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3">
    {% for product in products %}
    <div class="col">{% include "partials/_product_card.html" %}</div>
    {% endfor %}
</div>
{% endblock %}
